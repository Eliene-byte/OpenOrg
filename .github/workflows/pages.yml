name: Deploy GitHub Pages (OpenOrg)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar catalogo
        run: |
          node -e "const d=require('./data/index.json'); if(!Array.isArray(d)) throw new Error('index.json invalido'); console.log(d.length+' itens validados')"
          ls -R
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: '.' }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
